# Explicit project name: ensures existing volumes (upm_match_*) are reused regardless of the working directory.
name: upm_match

# =============================================================================
# UPM Match - Docker Compose
#
# Network architecture (subpath routing):
#   - A container Nginx is the ONLY external entry point, published on loopback (127.0.0.1:${HOST_PORT}:80).
#     In production the host-managed Nginx forwards ${PUBLIC_BASE_URL} to that port; locally you hit it directly.
#   - Routing lives in nginx/default.conf.template; everything hangs under the single subpath ${APP_BASE_PATH} (e.g. /upm-match).
#   - All other services do NOT publish ports to the host.
#
# Public URLs (replace localhost:${HOST_PORT} with your domain in production):
#   http://localhost:${HOST_PORT}${APP_BASE_PATH}/                  -> UPM Match app
#   http://localhost:${HOST_PORT}${APP_BASE_PATH}/airflow           -> Airflow Webserver
#   http://localhost:${HOST_PORT}${APP_BASE_PATH}/lab               -> Memgraph Lab
#   http://localhost:${HOST_PORT}${APP_BASE_PATH}/qdrant/dashboard  -> Qdrant dashboard
#   (MinIO S3 / Ollama / Memgraph Bolt / Qdrant gRPC stay internal — no public route.)
#
# Usage (always from the project root):
#   docker compose --env-file .env -f infra/docker-compose.yaml <command>
#
# The --env-file flag is required because Docker Compose looks for .env in the compose file's directory (infra/) but the .env lives at the project root.
#
# See infra/README.md for full setup instructions.
# =============================================================================


# Airflow shared configuration
# All Airflow services extend this block with <<: *airflow-common.
x-airflow-common: &airflow-common
  build:
    context: ..                          # project root
    dockerfile: infra/airflow/Dockerfile # relative to context
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__BASE_URL: "${PUBLIC_BASE_URL}/airflow"
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    IN_DOCKER: "true"
    UV_PROJECT_ENVIRONMENT: /home/airflow/upm_venv
    UV_PYTHON: "3.13"
    PYTHONUNBUFFERED: "1"
    # Network overrides: use service names (not container names) to avoid underscore DNS issues
    MINIO_HOST: minio
    MINIO_PORT: "9000"
    MEMGRAPH_HOST: memgraph
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    OLLAMA_HOST: ${OLLAMA_HOST}
    OLLAMA_PORT: ${OLLAMA_PORT}
    APP_BASE_PATH: ${APP_BASE_PATH}      # used by the webserver healthcheck path below
  volumes:
    - ./airflow/dags:/opt/airflow/dags   # relative to infra/
    - ..:/opt/airflow/project            # project root
  networks:
    - upm_match_network
    - ollama_network                     # to reach the existing Ollama container (${OLLAMA_HOST})
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


services:

  # Reverse proxy (subpath router), which is the only externally published service.
  nginx:
    image: nginx:1.27-alpine
    container_name: upm_match_nginx
    restart: unless-stopped
    environment:
      # Substituted into default.conf.template by the image's envsubst entrypoint.
      # Only APP_BASE_PATH is substituted; internal upstream ports are hardcoded in
      # the template, and $host/$uri/etc. are left intact.
      APP_BASE_PATH: ${APP_BASE_PATH}
      NGINX_ENVSUBST_FILTER: "^APP_BASE_PATH$$"
    ports:
      # External (host) port = HOST_PORT (the only tunable side); container port is
      # fixed at 80. In production the host Nginx forwards ${PUBLIC_BASE_URL} here.
      # Never bind 0.0.0.0 (the host already owns :80/:443).
      - "127.0.0.1:${HOST_PORT}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
      - airflow-webserver
      - lab
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Object storage
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: upm_match_minio
    restart: unless-stopped
    # Uncomment for direct host access during local development.
    # ports:
    #   - "127.0.0.1:${MINIO_PORT}:9000"           # S3 API  -> localhost:${MINIO_PORT}
    #   - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"   # Console -> localhost:${MINIO_CONSOLE_PORT}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Graph database
  memgraph:
    # Uncomment for direct host access during local development.
    # ports:
    #   - "127.0.0.1:${MEMGRAPH_PORT}:7687"   # Bolt protocol -> localhost:${MEMGRAPH_PORT}
    image: memgraph/memgraph-mage:3.8.1
    container_name: upm_match_memgraph
    restart: unless-stopped
    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USERNAME}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
    volumes:
      - memgraph_data:/var/lib/memgraph
    command: ["--memory-limit=7168", "--log-level=WARNING"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --username ${MEMGRAPH_USERNAME} --password ${MEMGRAPH_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 8g
    cpus: 2.0
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Memgraph GUI (served under ${APP_BASE_PATH}/lab)
  lab:
    image: memgraph/lab:3.10.0
    container_name: upm_match_memgraph_lab
    restart: unless-stopped
    environment:
      - QUICK_CONNECT_MG_HOST=upm_match_memgraph
      - QUICK_CONNECT_MG_PORT=7687
      # Makes Lab serve all assets/links under the subpath (no strip in Nginx)
      - BASE_PATH=${APP_BASE_PATH}/lab
    depends_on:
      - memgraph
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Local LLM
  # NOTE: We no longer run our own Ollama container. 
  # We connect to an existing one over an external network.
  # The services that need it (app, airflow-*) join the ${OLLAMA_NETWORK} network and target the ${OLLAMA_HOST}:${OLLAMA_PORT} container.
  # See the 'networks' section at the bottom and the Ollama vars in .env.


  # Vector database
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: upm_match_qdrant
    restart: unless-stopped
    # Uncomment for direct host access during local development.
    # ports:
    #   - "127.0.0.1:${QDRANT_PORT}:6333"   # -> localhost:${QDRANT_PORT}
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 4g
    cpus: 2.0
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Airflow metadata (PostgreSQL)
  postgres:
    image: postgres:17-alpine
    container_name: upm_match_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - upm_match_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Flask web app (served under ${APP_BASE_PATH}/)
  app:
    build:
      context: ..                       # project root
      dockerfile: infra/app/Dockerfile
    container_name: upm_match_app
    restart: unless-stopped
    env_file: ../.env
    environment:
      IN_DOCKER: "true"
      # Mounts the Flask blueprint under the subpath so url_for() emits /upm-match/...
      APP_BASE_PATH: ${APP_BASE_PATH}
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MEMGRAPH_HOST: memgraph
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_HOST: "http://${OLLAMA_HOST}:${OLLAMA_PORT}"   # external Ollama container (e.g. ollama_low)
      OLLAMA_PORT: ${OLLAMA_PORT}
    depends_on:
      - qdrant
    networks:
      - upm_match_network
      - ollama_network                         # to reach the existing Ollama container (${OLLAMA_HOST})
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # Airflow init (runs once then exits)
  airflow-init:
    <<: *airflow-common
    container_name: upm_match_airflow_init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@upm.es}" 2>/dev/null || true
        echo "Airflow init complete."


  # Airflow scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: upm_match_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 4g
    cpus: 2.0


  # Airflow webserver (served under ${APP_BASE_PATH}/airflow)
  airflow-webserver:
    <<: *airflow-common
    container_name: upm_match_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      # Airflow serves under BASE_URL now, so /health lives under the subpath.
      test: ["CMD-SHELL", "curl -f http://localhost:8080${APP_BASE_PATH}/airflow/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g
    cpus: 1.0


volumes:
  minio_data:
  memgraph_data:
  qdrant_data:
  postgres_data:


networks:
  upm_match_network:
    driver: bridge
  # Pre-existing network where the Ollama container lives. 
  # 'external: true' means Compose will NOT create it, it must already exist.
  # Verify with: docker network ls | grep "$OLLAMA_NETWORK"
  ollama_network:
    external: true
    name: ${OLLAMA_NETWORK}
