# =============================================================================
# Block for the HOST Nginx (managed by the server admin / tutor - NOT by us).
#
# Why this change: the prefix /upm-match must be PRESERVED, not stripped. 
# So the proxy_pass must NOT contain a path (no trailing "/upm-match" and no "/"). 
# That way the container Nginx (and every app behind it) receives the exact same path the browser sent and generates correct links.
# We also propagate the public scheme (https) and add WebSocket + upload support.
#
# Replace XYXY with the real HOST_PORT (kept private, lives only in our .env) and
# <your-domain> with the public domain.
# =============================================================================

# Goes ONCE in the http{} block (needed for WebSocket upgrades)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Goes inside the server{} that terminates TLS for https://<your-domain>

# Optional: bare prefix -> trailing slash.
location = /upm-match { return 301 /upm-match/; }

location /upm-match/ {
    proxy_pass http://127.0.0.1:8383;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;  # https at the public edge -> propagated inward
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;  # requires the map above in http{}
    client_max_body_size 100m;
}
