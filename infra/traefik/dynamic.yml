# =============================================================================
# Traefik - Dynamic configuration (file provider)
#
# Routes are read from this file. After any change, restart Traefik to reload
# (inotify watch does not work reliably on Windows volume mounts):
#   docker compose -f infra/docker-compose.yaml restart traefik
#
# To enable a security middleware:
#   1) Uncomment its definition in the 'middlewares' section.
#   2) Add its name to the 'middlewares' list of the target router.
#
# Generating a Basic Auth hash:
#   docker run --rm httpd:2.4-alpine htpasswd -nbB admin YOUR_PASSWORD
#   Output: admin:$2y$05$HASH  (no escaping needed here — this is not docker-compose)
# =============================================================================

http:

  routers:

    traefik-dashboard:
      rule: "Host(`traefik.localhost`)"
      entrypoints: [web]
      service: api@internal

    airflow:
      rule: "Host(`localhost`) && PathPrefix(`/airflow`)"
      entrypoints: [web]
      service: airflow
      # No StripPrefix: Airflow with BASE_URL expects to receive the full /airflow/... path.
      # With Basic Auth (Airflow has its own login — optional):
      # middlewares: [gui-auth]

    ollama:
      rule: "Host(`localhost`) && PathPrefix(`/ollama`)"
      entrypoints: [web]
      middlewares: [strip-ollama]
      service: ollama
      # With IP AllowList:
      # middlewares: [strip-ollama, api-allowlist]

    qdrant:
      rule: "Host(`qdrant.localhost`)"
      entrypoints: [web]
      service: qdrant
      # With IP AllowList:
      # middlewares: [api-allowlist]

    lab:
      rule: "Host(`lab.localhost`)"
      entrypoints: [web]
      service: lab
      # With Basic Auth:
      # middlewares: [gui-auth]

    minio-console:
      rule: "Host(`minio.localhost`)"
      entrypoints: [web]
      service: minio-console
      # With Basic Auth (MinIO has its own login — optional):
      # middlewares: [gui-auth]

    minio-api:
      rule: "Host(`localhost`) && PathPrefix(`/s3`)"
      entrypoints: [web]
      middlewares: [strip-s3]
      service: minio-api
      # With IP AllowList:
      # middlewares: [strip-s3, api-allowlist]


  middlewares:

    strip-ollama:
      stripPrefix:
        prefixes: ["/ollama"]

    strip-s3:
      stripPrefix:
        prefixes: ["/s3"]

    # Security middlewares (disabled — uncomment to activate)

    # [1] IP AllowList — restrict access to APIs and databases
    # api-allowlist:
    #   ipAllowList:
    #     sourceRange:
    #       - "127.0.0.1/32"
    #       - "192.168.1.0/24"  # local network — adjust as needed

    # [2] Basic Auth — protect GUIs with HTTP username/password
    # gui-auth:
    #   basicAuth:
    #     users:
    #       - "admin:$2y$05$HASH_HERE"


  services:

    airflow:
      loadBalancer:
        servers:
          - url: "http://tfm_airflow_webserver:8080"

    ollama:
      loadBalancer:
        servers:
          - url: "http://tfm_ollama:11434"

    qdrant:
      loadBalancer:
        servers:
          - url: "http://tfm_qdrant:6333"

    lab:
      loadBalancer:
        servers:
          - url: "http://tfm_memgraph_lab:3000"

    minio-console:
      loadBalancer:
        servers:
          - url: "http://tfm_minio:9001"

    minio-api:
      loadBalancer:
        servers:
          - url: "http://tfm_minio:9000"
