  memgraph:
    image: memgraph/memgraph-mage:3.8.1
    container_name: tfm_memgraph
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MEMGRAPH_QUERIES}:7687"
      - "127.0.0.1:${MEMGRAPH_LOGS}:7444"

    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USERNAME}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}

    volumes:
      - memgraph_data:/var/lib/memgraph

    # Forzamos un límite de memoria interna y habilitamos autenticación
    command: ["--memory-limit=7168", "--log-level=WARNING"]

    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --username ${MEMGRAPH_USERNAME} --password ${MEMGRAPH_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 8g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  lab:
    image: memgraph/lab:3.10.0
    container_name: tfm_memgraph_lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB_PORT}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=tfm_memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph
    networks:
      - tfm_network

  ollama:
    image: ollama/ollama:0.30.0
    container_name: tfm_ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 8g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: tfm_qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 4g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network


volumes:
  minio_data:
  # arango_data:
  memgraph_data:
  ollama_data:
  qdrant_data:


networks:
  tfm_network:
    driver: bridge