# Configuración común para todos los contenedores de Airflow.
# Los servicios individuales extienden este bloque con <<: *airflow-common.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # uv: entorno del proyecto en volumen dedicado para evitar conflictos con .venv de Windows
    UV_PROJECT_ENVIRONMENT: /opt/airflow/upm_venv
    UV_PYTHON: "3.13"
    # Overrides de red: los servicios se acceden por nombre de contenedor dentro de tfm_network
    MINIO_HOST: tfm_minio
    MINIO_PORT: "9000"
    MEMGRAPH_HOST: tfm_memgraph
    QDRANT_HOST: tfm_qdrant
    QDRANT_PORT: "6333"
    OLLAMA_HOST: tfm_ollama
    OLLAMA_PORT: "11434"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - .:/opt/airflow/project
    - upm_project_venv:/opt/airflow/upm_venv
  networks:
    - tfm_network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


services:

  # Almacenamiento de objetos
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tfm_minio
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 512m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  # Base de datos de grafos
  memgraph:
    image: memgraph/memgraph-mage:3.8.1
    container_name: tfm_memgraph
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MEMGRAPH_QUERIES}:7687"
      - "127.0.0.1:${MEMGRAPH_LOGS}:7444"

    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USERNAME}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}

    volumes:
      - memgraph_data:/var/lib/memgraph

    # Forzamos un límite de memoria interna y habilitamos autenticación
    command: ["--memory-limit=7168", "--log-level=WARNING"]

    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --username ${MEMGRAPH_USERNAME} --password ${MEMGRAPH_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 8g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  lab:
    image: memgraph/lab:3.10.0
    container_name: tfm_memgraph_lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB_PORT}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=tfm_memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph
    networks:
      - tfm_network

  # LLM local
  ollama:
    image: ollama/ollama:0.30.0
    container_name: tfm_ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 8g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  # Base de datos vectorial
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: tfm_qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

    mem_limit: 4g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  # Metadatos de Airflow
  postgres:
    image: postgres:17-alpine
    container_name: tfm_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 256m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tfm_network

  # Inicializador de Airflow (se ejecuta tan solo una vez)
  airflow-init:
    <<: *airflow-common
    container_name: tfm_airflow_init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@upm.es}" 2>/dev/null || true
        echo "Airflow init completado."

  # Scheduler de Airflow
  airflow-scheduler:
    <<: *airflow-common
    container_name: tfm_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

    mem_limit: 1g
    cpus: 1.0

  # Webserver de Airflow (GUI en http://localhost:8080) ─
  airflow-webserver:
    <<: *airflow-common
    container_name: tfm_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    command: webserver

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    mem_limit: 1g
    cpus: 1.0


volumes:
  minio_data:
  memgraph_data:
  ollama_data:
  qdrant_data:
  postgres_data:
  upm_project_venv:


networks:
  tfm_network:
    driver: bridge